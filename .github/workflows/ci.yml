name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, NOT 20. Every script in package.json runs node with
          # --use-system-ca, which does not exist before 22.15, so a Node 20
          # runner fails on the flag before it ever reaches the build:
          #
          #     node: bad option: --use-system-ca
          #
          # Keep this in step with the Node the site is actually built with.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The build alone did not catch a broken helper, only a broken import.
      - run: npm test
